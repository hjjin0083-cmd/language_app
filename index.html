<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4개 국어 대화형 학습기</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 사이드바 (대화방 목록) */
        .sidebar {
            width: 280px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #34495e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 { margin: 0; font-size: 16px; }
        .new-chat-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .new-chat-btn:hover { background-color: #2980b9; }

        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .room-item {
            padding: 10px 12px;
            border-radius: 8px;
            background-color: #34495e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        .room-item:hover, .room-item.active {
            background-color: #1abc9c;
        }
        .room-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }
        .room-actions { display: flex; gap: 4px; opacity: 0.8; }
        .room-actions span:hover { opacity: 1; }

        /* 메인 컨텐츠 영역 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .toggle-sidebar-btn {
            display: none;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        h2 { margin: 0; color: #2c3e50; font-size: 20px; }

        /* 대화 히스토리 말풍선 */
        .chat-history {
            flex: 1;
            max-height: 350px;
            overflow-y: auto;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background-color: #3498db;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .chat-bubble.model {
            align-self: flex-start;
            background-color: #e2e8f0;
            color: #2c3e50;
            border-bottom-left-radius: 2px;
        }

        /* 입력 영역 */
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #3498db; }
        .send-btn {
            padding: 12px 24px;
            font-size: 15px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:hover { background-color: #1a252f; }
        .send-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }

        .loading-box {
            display: none;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            color: #3498db;
        }
        .error-box {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            background: #fdecec;
            border-left: 5px solid #e74c3c;
            color: #922b21;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        /* 4개 국어 결과 카드 */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .lang-card {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            position: relative;
        }
        .lang-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .lang-title { font-weight: bold; font-size: 16px; color: #2c3e50; }
        .speaker-btn {
            background: none;
            color: #2c3e50;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: transform 0.1s, background-color 0.2s;
        }
        .speaker-btn:hover {
            background-color: rgba(0, 0, 0, 0.08);
            transform: scale(1.15);
        }
        .sov-group { background-color: #e8f4f8; border-color: #bce0fd; }
        .svo-group { background-color: #eafaf1; border-color: #c3e6cb; }
        .lang-text { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 6px; line-height: 1.4; }
        .pronunciation { color: #555; font-size: 13px; line-height: 1.4; }
        .structure { margin-top: 6px; font-size: 12px; color: #666; }
        
        .metadata-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #fff8e1;
            border-left: 5px solid #ffc107;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        /* 모바일 대응 레이아웃 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
            }
            .sidebar.open { left: 0; }
            .toggle-sidebar-btn { display: block; }
            .main-content { padding: 10px; }
            .container { padding: 12px; }
            .input-group { flex-direction: column; }
            .send-btn { width: 100%; }
        }
    </style>
</head>
<body>

<!-- 좌측 사이드바 (대화방 목록) -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h3>💬 대화방 목록</h3>
        <button class="new-chat-btn" onclick="createNewRoom()">+ 새 대화방</button>
    </div>
    <div class="room-list" id="roomList"></div>
</div>

<!-- 메인 학습기 영역 -->
<div class="main-content">
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
                <h2 id="currentRoomTitle">💬 4개 국어 대화형 AI 학습기</h2>
            </div>
        </div>

        <!-- 대화 내역 영역 -->
        <div class="chat-history" id="chatHistory">
            <div class="chat-bubble model">
                안녕하세요! 학습할 문장을 입력하거나, 자유롭게 질문해보세요. 대화 내역은 자동 저장됩니다.
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput"
                   placeholder="문장 입력 또는 질문하기 (예: 방금 표현을 정중하게 바꿔줘)"
                   onkeydown="if(event.key === 'Enter') sendQuery()">
            <button class="send-btn" id="sendBtn" onclick="sendQuery()">보내기</button>
        </div>

        <div id="loading" class="loading-box">⏳ AI가 답변과 4개 국어를 분석 중입니다...</div>
        <div id="errorBox" class="error-box"></div>

        <!-- 4개 국어 카드 -->
        <div class="result-grid" id="resultGrid" style="display: none;">
            <div class="lang-card sov-group">
                <div class="lang-header">
                    <span class="lang-title">🇰🇷 한국어 (SOV)</span>
                    <button class="speaker-btn" onclick="speakText('text-kr', 'ko-KR')" title="발음 듣기">🔊</button>
                </div>
                <div class="lang-text" id="text-kr"></div>
                <div class="pronunciation" id="pron-kr"></div>
                <div class="structure" id="structure-kr"></div>
            </div>

            <div class="lang-card svo-group">
                <div class="lang-header">
                    <span class="lang-title">🇺🇸 영어 (SVO)</span>
                    <button class="speaker-btn" onclick="speakText('text-en', 'en-US')" title="발음 듣기">🔊</button>
                </div>
                <div class="lang-text" id="text-en"></div>
                <div class="pronunciation" id="pron-en"></div>
                <div class="structure" id="structure-en"></div>
            </div>

            <div class="lang-card svo-group">
                <div class="lang-header">
                    <span class="lang-title">🇨🇳 중국어 (SVO)</span>
                    <button class="speaker-btn" onclick="speakText('text-cn', 'zh-CN')" title="발음 듣기">🔊</button>
                </div>
                <div class="lang-text" id="text-cn"></div>
                <div class="pronunciation" id="pron-cn"></div>
                <div class="structure" id="structure-cn"></div>
            </div>

            <div class="lang-card sov-group">
                <div class="lang-header">
                    <span class="lang-title">🇯🇵 일본어 (SOV)</span>
                    <button class="speaker-btn" onclick="speakText('text-jp', 'ja-JP')" title="발음 듣기">🔊</button>
                </div>
                <div class="lang-text" id="text-jp"></div>
                <div class="pronunciation" id="pron-jp"></div>
                <div class="structure" id="structure-jp"></div>
            </div>
        </div>

        <div class="metadata-box" id="metadataBox" style="display: none;"></div>
    </div>
</div>

<script>
// LocalStorage 기반 데이터 모델 관리
const STORAGE_KEY = 'multilingual_app_rooms_v1';
let rooms = [];
let activeRoomId = null;

// 모바일 사이드바 토글
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

// 앱 초기화 로드
window.addEventListener('DOMContentLoaded', () => {
    loadRoomsFromStorage();
    if (rooms.length === 0) {
        createNewRoom();
    } else {
        switchRoom(rooms[0].id);
    }
});

function loadRoomsFromStorage() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        rooms = saved ? JSON.parse(saved) : [];
    } catch (e) {
        console.error('저장소 로드 실패:', e);
        rooms = [];
    }
}

function saveRoomsToStorage() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
    } catch (e) {
        console.error('저장소 저장 실패:', e);
    }
}

// 대화방 생성
function createNewRoom() {
    const newRoom = {
        id: 'room_' + Date.now(),
        title: '새로운 대화방',
        history: [], // API용 [{role, content}]
        uiBubbles: [], // 화면 표시용 [{role, text}]
        lastResult: null // 마지막 번역 결과
    };
    rooms.unshift(newRoom);
    saveRoomsToStorage();
    renderRoomList();
    switchRoom(newRoom.id);
    
    // 모바일인 경우 메뉴 닫기
    document.getElementById('sidebar').classList.remove('open');
}

// 대화방 전환
function switchRoom(roomId) {
    activeRoomId = roomId;
    const room = rooms.find(r => r.id === roomId);
    if (!room) return;

    document.getElementById('currentRoomTitle').textContent = room.title;
    renderRoomList();
    renderChatHistory(room);
    renderLastResult(room.lastResult);
    document.getElementById('errorBox').style.display = 'none';
}

// 대화방 삭제
function deleteRoom(roomId, event) {
    event.stopPropagation();
    if (!confirm('이 대화방을 삭제하시겠습니까?')) return;

    rooms = rooms.filter(r => r.id !== roomId);
    saveRoomsToStorage();

    if (rooms.length === 0) {
        createNewRoom();
    } else {
        switchRoom(rooms[0].id);
    }
}

// 대화방 이름 변경
function renameRoom(roomId, event) {
    event.stopPropagation();
    const room = rooms.find(r => r.id === roomId);
    if (!room) return;

    const newTitle = prompt('대화방 이름을 입력하세요:', room.title);
    if (newTitle && newTitle.trim()) {
        room.title = newTitle.trim();
        saveRoomsToStorage();
        renderRoomList();
        if (activeRoomId === roomId) {
            document.getElementById('currentRoomTitle').textContent = room.title;
        }
    }
}

// 대화방 목록 화면 그리기
function renderRoomList() {
    const listEl = document.getElementById('roomList');
    listEl.innerHTML = '';

    rooms.forEach(room => {
        const item = document.createElement('div');
        item.className = `room-item ${room.id === activeRoomId ? 'active' : ''}`;
        item.onclick = () => switchRoom(room.id);

        item.innerHTML = `
            <span class="room-title">${escapeHtml(room.title)}</span>
            <div class="room-actions">
                <span onclick="renameRoom('${room.id}', event)" title="이름 변경">✏️</span>
                <span onclick="deleteRoom('${room.id}', event)" title="삭제">🗑️</span>
            </div>
        `;
        listEl.appendChild(item);
    });
}

// 채팅 내역 그리기
function renderChatHistory(room) {
    const historyContainer = document.getElementById('chatHistory');
    historyContainer.innerHTML = '';

    if (!room.uiBubbles || room.uiBubbles.length === 0) {
        historyContainer.innerHTML = `
            <div class="chat-bubble model">
                안녕하세요! 학습할 문장을 입력하거나, 자유롭게 질문해보세요.
            </div>`;
        return;
    }

    room.uiBubbles.forEach(b => {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${b.role}`;
        bubble.textContent = b.text;
        historyContainer.appendChild(bubble);
    });
    historyContainer.scrollTop = historyContainer.scrollHeight;
}

// 마지막 4개 국어 카드 데이터 표시
function renderLastResult(data) {
    const resultGrid = document.getElementById('resultGrid');
    const metadataBox = document.getElementById('metadataBox');

    if (!data) {
        resultGrid.style.display = 'none';
        metadataBox.style.display = 'none';
        return;
    }

    const languages = data.languages || {};
    const items = [
        ['korean', 'kr'],
        ['english', 'en'],
        ['chinese', 'cn'],
        ['japanese', 'jp']
    ];

    items.forEach(([key, short]) => {
        const item = languages[key] || {};
        setText(`text-${short}`, item.text);
        setText(`pron-${short}`, item.pronunciation ? `발음: ${item.pronunciation}` : '');
        setText(`structure-${short}`, item.structure ? `어순: ${item.structure}` : '');
    });

    setText('metadataBox', data.metadata?.contrast_note || '');
    resultGrid.style.display = 'grid';
    metadataBox.style.display = data.metadata?.contrast_note ? 'block' : 'none';
}

function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value || '';
}

function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
}

function showError(message) {
    const box = document.getElementById('errorBox');
    box.textContent = message;
    box.style.display = 'block';
}

// 음성 재생 함수 (모바일 대응)
function speakText(elementId, langCode) {
    const el = document.getElementById(elementId);
    if (!el || !el.innerText.trim() || !('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();

    const textToSpeak = el.innerText.trim();
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = langCode;
    utterance.rate = 0.85;

    const langMap = {
        'ko-KR': ['ko-KR', 'ko'],
        'en-US': ['en-US', 'en'],
        'zh-CN': ['zh-CN', 'zh-Hans', 'zh'],
        'ja-JP': ['ja-JP', 'ja']
    };

    const targetLangs = langMap[langCode] || [langCode];
    const voices = window.speechSynthesis.getVoices();

    if (voices.length > 0) {
        const matchedVoice = voices.find(v => 
            targetLangs.some(l => v.lang.replace('_', '-').toLowerCase().startsWith(l.toLowerCase()))
        );
        if (matchedVoice) {
            utterance.voice = matchedVoice;
        }
    }

    setTimeout(() => {
        window.speechSynthesis.speak(utterance);
    }, 50);
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

// 메시지 전송
async function sendQuery() {
    const inputEl = document.getElementById('userInput');
    const btnEl = document.getElementById('sendBtn');
    const loadingEl = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const text = inputEl.value.trim();

    if (!text) {
        showError('문장이나 질문을 입력해주세요.');
        inputEl.focus();
        return;
    }

    const currentRoom = rooms.find(r => r.id === activeRoomId);
    if (!currentRoom) return;

    // 첫 메시지 전송 시 대화방 제목 자동 설정
    if (currentRoom.history.length === 0 && currentRoom.title === '새로운 대화방') {
        currentRoom.title = text.length > 12 ? text.substring(0, 12) + '...' : text;
        document.getElementById('currentRoomTitle').textContent = currentRoom.title;
        renderRoomList();
    }

    // UI 및 메시지 히스토리 업데이트
    currentRoom.uiBubbles.push({ role: 'user', text: text });
    renderChatHistory(currentRoom);

    inputEl.value = '';
    btnEl.disabled = true;
    loadingEl.style.display = 'block';
    errorBox.style.display = 'none';

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text: text,
                history: currentRoom.history
            })
        });

        let data;
        try {
            data = await response.json();
        } catch (_) {
            throw new Error(`서버 응답 오류 (HTTP ${response.status})`);
        }

        if (!response.ok) {
            throw new Error(data.detail || `서버 오류 발생 (HTTP ${response.status})`);
        }

        // 서버 전송용 백엔드 대화 내역 저장
        currentRoom.history.push({ role: 'user', content: text });
        currentRoom.history.push({ role: 'model', content: data.languages?.korean?.text || text });

        // 화면용 대화 내용 및 카드 저장
        if (data.metadata?.contrast_note) {
            currentRoom.uiBubbles.push({ role: 'model', text: data.metadata.contrast_note });
        }
        currentRoom.lastResult = data;

        saveRoomsToStorage();
        renderChatHistory(currentRoom);
        renderLastResult(data);

    } catch (error) {
        console.error(error);
        showError(error.message || '알 수 없는 오류가 발생했습니다.');
    } finally {
        loadingEl.style.display = 'none';
        btnEl.disabled = false;
    }
}
</script>
</body>
</html>
