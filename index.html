<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4개 국어 대화형 학습기</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 { margin: 0; color: #2c3e50; font-size: 20px; }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lang-select {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
        }

        .reset-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .reset-btn:hover { background-color: #c0392b; }

        /* 대화창 스타일 */
        .chat-history {
            height: 500px;
            overflow-y: auto;
            background: #f0f4f8;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 유저 말풍선 */
        .user-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: 15%;
        }
        .chat-bubble-user {
            background-color: #3b82f6;
            color: white;
            padding: 12px 16px;
            border-radius: 16px 16px 2px 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }
        .user-toggle-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 11px;
            cursor: pointer;
            margin-top: 4px;
            padding: 2px 6px;
        }
        .user-toggle-btn:hover { text-decoration: underline; color: #2563eb; }

        .user-translation-card {
            display: none;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            margin-top: 6px;
            font-size: 13px;
            color: #334155;
        }
        .trans-header {
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 6px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
            font-size: 12px;
        }
        .trans-item { margin-bottom: 4px; }

        /* AI 대답 영역 */
        .ai-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-right: 10%;
        }
        .ai-profile {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .ai-card-container {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 2px 16px 16px 16px;
            padding: 16px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .ai-lang-group {
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .ai-lang-group:last-child { margin-bottom: 0; }
        .sov-bg { background-color: #f0f9ff; border-left: 4px solid #0284c7; }
        .svo-bg { background-color: #f0fdf4; border-left: 4px solid #16a34a; }
        
        .ai-lang-title {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .ai-lang-text {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.4;
        }
        .ai-sub-info { font-size: 12px; color: #64748b; margin-top: 2px; }

        .speaker-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .meta-note {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #fffbe3;
            border-left: 3px solid #f59e0b;
            border-radius: 4px;
            font-size: 12px;
            color: #78350f;
            white-space: pre-wrap;
        }

        /* 입력바 */
        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        .send-btn {
            padding: 15px 28px;
            font-size: 16px;
            background-color: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .loading-box {
            display: none;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            color: #2563eb;
            font-size: 14px;
        }
        .error-box {
            display: none;
            margin-bottom: 10px;
            padding: 10px;
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>💬 4개 국어 AI 다자간 회화 학습기</h2>
        <div class="header-controls">
            <!-- 사용자 언어 선택 -->
            <select id="userLangSelect" class="lang-select">
                <option value="korean" selected>🇰🇷 한국어로 대화</option>
                <option value="english">🇺🇸 영어로 대화</option>
                <option value="japanese">🇯🇵 일본어로 대화</option>
                <option value="chinese">🇨🇳 중국어로 대화</option>
            </select>
            <button class="reset-btn" onclick="resetChat()">새 대화</button>
        </div>
    </div>

    <!-- 대화 영역 -->
    <div class="chat-history" id="chatHistory">
        <div class="ai-wrapper">
            <div class="ai-profile">🤖 AI 4개 국어 대화 팀</div>
            <div class="ai-card-container">
                <div class="ai-lang-text">원하시는 언어를 선택하고 대화를 시작하세요! 사용자가 어떤 언어로 말하든 AI가 모두 알아듣고 4개 국어로 맞장구를 쳐줍니다.</div>
            </div>
        </div>
    </div>

    <div id="loading" class="loading-box">⏳ AI가 답변을 작성하고 4개 국어로 대조 분석 중입니다...</div>
    <div id="errorBox" class="error-box"></div>

    <div class="input-group">
        <input type="text" id="userInput"
               placeholder="선택한 언어로 자유롭게 말해보세요..."
               onkeydown="if(event.key === 'Enter') sendQuery()">
        <button class="send-btn" id="sendBtn" onclick="sendQuery()">보내기</button>
    </div>
</div>

<script>
let conversationHistory = [];

function speakDirect(text, langCode) {
    if (!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langCode;
    utterance.rate = 0.9;
    setTimeout(() => { window.speechSynthesis.speak(utterance); }, 50);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
}

function toggleUserTranslation(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'block' : 'none';
}

function appendUserMessage(userText, userAnalysis, selectedLang) {
    const historyContainer = document.getElementById('chatHistory');
    const wrapper = document.createElement('div');
    wrapper.className = 'user-wrapper';

    const toggleId = 'user-trans-' + Date.now();
    const langBadges = { korean: '🇰🇷 KO', english: '🇺🇸 EN', japanese: '🇯🇵 JP', chinese: '🇨🇳 CN' };

    const htmlContent = `
        <div style="font-size:11px; color:#64748b; margin-bottom:2px;">[${langBadges[selectedLang] || '내 언어'}]</div>
        <div class="chat-bubble-user">${escapeHtml(userText)}</div>
        <button class="user-toggle-btn" onclick="toggleUserTranslation('${toggleId}')">
            🌐 내 문장 4개국어 분석 보기 ▾
        </button>
        <div id="${toggleId}" class="user-translation-card">
            <div class="trans-header">✨ 내 문장 4개 국어 대조</div>
            <div class="trans-item">🇰🇷 <strong>KO:</strong> ${escapeHtml(userAnalysis?.korean || '')}</div>
            <div class="trans-item">🇺🇸 <strong>EN:</strong> ${escapeHtml(userAnalysis?.english?.text || '')}</div>
            <div class="trans-item">🇨🇳 <strong>CN:</strong> ${escapeHtml(userAnalysis?.chinese?.text || '')} <span style="color:#64748b;">(${escapeHtml(userAnalysis?.chinese?.pronunciation || '')})</span></div>
            <div class="trans-item">🇯🇵 <strong>JP:</strong> ${escapeHtml(userAnalysis?.japanese?.text || '')} <span style="color:#64748b;">(${escapeHtml(userAnalysis?.japanese?.pronunciation || '')})</span></div>
        </div>
    `;

    wrapper.innerHTML = htmlContent;
    historyContainer.appendChild(wrapper);
    historyContainer.scrollTop = historyContainer.scrollHeight;
}

function appendAIMessage(data) {
    const historyContainer = document.getElementById('chatHistory');
    const wrapper = document.createElement('div');
    wrapper.className = 'ai-wrapper';

    const languages = data.languages || {};
    const metadata = data.metadata || {};

    const htmlContent = `
        <div class="ai-profile">🤖 AI 4개 국어 대화 팀</div>
        <div class="ai-card-container">
            <div class="ai-lang-group sov-bg">
                <div class="ai-lang-title">
                    <span>🇰🇷 한국어 AI</span>
                    <button class="speaker-btn" onclick="speakDirect('${escapeHtml(languages.korean?.text)}', 'ko-KR')">🔊</button>
                </div>
                <div class="ai-lang-text">${escapeHtml(languages.korean?.text)}</div>
            </div>

            <div class="ai-lang-group svo-bg">
                <div class="ai-lang-title">
                    <span>🇺🇸 영어 AI (SVO)</span>
                    <button class="speaker-btn" onclick="speakDirect('${escapeHtml(languages.english?.text)}', 'en-US')">🔊</button>
                </div>
                <div class="ai-lang-text">${escapeHtml(languages.english?.text)}</div>
            </div>

            <div class="ai-lang-group svo-bg">
                <div class="ai-lang-title">
                    <span>🇨🇳 중국어 AI (SVO)</span>
                    <button class="speaker-btn" onclick="speakDirect('${escapeHtml(languages.chinese?.text)}', 'zh-CN')">🔊</button>
                </div>
                <div class="ai-lang-text">${escapeHtml(languages.chinese?.text)}</div>
                ${languages.chinese?.pronunciation ? `<div class="ai-sub-info">병음: ${escapeHtml(languages.chinese.pronunciation)}</div>` : ''}
            </div>

            <div class="ai-lang-group sov-bg">
                <div class="ai-lang-title">
                    <span>🇯🇵 일본어 AI (SOV)</span>
                    <button class="speaker-btn" onclick="speakDirect('${escapeHtml(languages.japanese?.text)}', 'ja-JP')">🔊</button>
                </div>
                <div class="ai-lang-text">${escapeHtml(languages.japanese?.text)}</div>
                ${languages.japanese?.pronunciation ? `<div class="ai-sub-info">발음: ${escapeHtml(languages.japanese.pronunciation)}</div>` : ''}
            </div>

            ${metadata.contrast_note ? `<div class="meta-note">💡 <strong>어순 및 문법 포인트:</strong>\n${escapeHtml(metadata.contrast_note)}</div>` : ''}
        </div>
    `;

    wrapper.innerHTML = htmlContent;
    historyContainer.appendChild(wrapper);
    historyContainer.scrollTop = historyContainer.scrollHeight;
}

function resetChat() {
    conversationHistory = [];
    document.getElementById('chatHistory').innerHTML = `
        <div class="ai-wrapper">
            <div class="ai-profile">🤖 AI 4개 국어 대화 팀</div>
            <div class="ai-card-container">
                <div class="ai-lang-text">새 대화가 시작되었습니다. 언어를 선택하여 자유롭게 말을 건네보세요!</div>
            </div>
        </div>`;
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('userInput').value = '';
}

async function sendQuery() {
    const inputEl = document.getElementById('userInput');
    const btnEl = document.getElementById('sendBtn');
    const loadingEl = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const langSelect = document.getElementById('userLangSelect');
    
    const text = inputEl.value.trim();
    const selectedLang = langSelect.value;

    if (!text) {
        showError('메시지를 입력해주세요.');
        inputEl.focus();
        return;
    }

    inputEl.value = '';
    btnEl.disabled = true;
    loadingEl.style.display = 'block';
    errorBox.style.display = 'none';

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text: text,
                selected_lang: selectedLang,
                history: conversationHistory
            })
        });

        let data;
        try {
            data = await response.json();
        } catch (_) {
            throw new Error(`서버 응답 형식이 올바르지 않습니다.`);
        }

        if (!response.ok) {
            throw new Error(data.detail || `서버 오류 발생 (${response.status})`);
        }

        appendUserMessage(text, data.user_analysis, selectedLang);
        appendAIMessage(data);

        conversationHistory.push({ role: 'user', content: text });
        conversationHistory.push({ role: 'model', content: data.languages?.korean?.text || '' });

    } catch (error) {
        showError(error.message || '오류가 발생했습니다.');
    } finally {
        loadingEl.style.display = 'none';
        btnEl.disabled = false;
    }
}
</script>
</body>
</html>
